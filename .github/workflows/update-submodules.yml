name: Update SAP docs sources

on:
  schedule:
    # Sundays at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    environment:
      name: remove server

    steps:
      - name: Update sources and rebuild the search index
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /opt/mcp-sap/mcp-sap-docs

            # Use the same lock as deployments so a release and source update cannot overlap.
            exec 9>/tmp/mcp-sap-deploy.lock
            flock -w 1800 9

            MCP_VARIANT=sap-docs SKIP_NESTED_SUBMODULES=1 bash setup.sh
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:3122/health
